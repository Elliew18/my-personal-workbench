<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5b8def">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的工作台">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>我的个人工作台</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#1a1d23;--text2:#6b7280;--muted:#8a94a6;--line:#e5e9f0;--accent:#5b8def;--accent2:#eaf1fe;--green:#7fd1ae;--green2:#e7f7f0;--green3:#3a9c78;--warn:#f0a868;--warn2:#fdf0e3;--red:#e8836b;--red2:#fdecea;--shadow:0 4px 18px rgba(60,80,120,.06);--radius:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;max-width:760px;margin:0 auto;padding:0 0 84px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,246,249,.92);backdrop-filter:saturate(180%) blur(12px);padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:8px}
.topbar h1{font-size:18px;margin:0;font-weight:600}
.topbar .date{color:var(--text2);font-size:13px;margin-top:2px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:760px;margin:0 auto;display:flex;background:rgba(255,255,255,.96);backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
.tabbar button{flex:1;border:none;background:none;padding:10px 2px 8px;font-size:11px;color:var(--text2);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit}
.tabbar button .ic{font-size:19px;line-height:1}
.tabbar button.active{color:var(--accent);font-weight:600}
section.page{display:none;padding:18px 16px 0}
section.page.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 .sub{font-size:12px;color:var(--text2);font-weight:400;margin-left:auto}
.muted{color:var(--text2)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.progress{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:6px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:8px;transition:width .4s}
.progress-num{font-size:13px;color:var(--text2)}
button.btn{border:none;background:var(--accent);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:500;transition:all .2s}
button.btn:active{transform:scale(.97)}
button.btn.ghost{background:var(--accent2);color:var(--accent)}
button.btn.soft{background:var(--green2);color:var(--green3)}
button.btn.mini{padding:6px 10px;font-size:12px;border-radius:9px}
button.btn.block{width:100%}
button.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:none;background:none;color:var(--text2);cursor:pointer;font-size:13px;padding:6px;border-radius:8px}
.icon-btn:hover{background:#f0f2f5}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fbfcfe;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:#fff}
textarea{resize:vertical;min-height:64px;line-height:1.5}
label.fld{display:block;font-size:12px;color:var(--text2);margin:10px 0 4px}
.three input{border:none;border-bottom:1px dashed var(--line);border-radius:0;padding:8px 2px;background:none}
.three input:focus{border-bottom-color:var(--accent)}
.item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .body{flex:1;min-width:0}
.item .title{font-size:14px;word-break:break-word}
.item .meta{font-size:12px;color:var(--text2);margin-top:2px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:1px;transition:all .2s}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--accent2);color:var(--accent);font-weight:500}
.pill.g{background:var(--green2);color:var(--green3)}
.pill.w{background:var(--warn2);color:#bf7a32}
.pill.r{background:var(--red2);color:var(--red)}
.pill.gray{background:#f0f2f5;color:var(--text2)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:#f0f2f5;color:#7a8294;margin:2px 3px 0 0}
.habit{border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}
.habit.done{background:var(--green2);border-color:transparent}
.chatbox{height:58vh;overflow-y:auto;padding:8px 4px 10px}
.chatbox::-webkit-scrollbar{width:4px}
.chatbox::-webkit-scrollbar-thumb{background:#d0d4dc;border-radius:4px}
.msg{display:flex;gap:8px;margin-bottom:14px;align-items:flex-start}
.msg .av{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600}
.msg.me .av{background:var(--accent);color:#fff}
.msg.xw .av{background:var(--green2);color:var(--green3)}
.msg .bubble{background:var(--card);border-radius:13px;padding:9px 12px;font-size:14px;max-width:78%;box-shadow:var(--shadow);white-space:pre-wrap;word-break:break-word;line-height:1.6}
.msg.me{flex-direction:row-reverse}
.msg.me .bubble{background:var(--accent);color:#fff}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:12px;color:var(--accent);cursor:pointer;font-family:inherit}
.quick button:hover{background:var(--accent2)}
details summary{cursor:pointer;list-style:none;color:var(--accent);font-size:13px;padding:4px 0;outline:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ "}
details[open] summary::before{content:"▾ "}
.empty{color:var(--text2);font-size:13px;text-align:center;padding:24px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--text2);font-family:inherit}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1a1d23;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center}
.toast.show{opacity:.95}
.hint{font-size:12px;color:var(--text2);margin-top:6px}
.danger{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat-card{text-align:center;padding:14px 8px;border-radius:12px;background:var(--bg)}
.stat-card .num{font-size:24px;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:12px;color:var(--text2);margin-top:2px}
.loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:20px;color:var(--text2);font-size:13px}
.typing{display:flex;gap:4px;align-items:center;padding:8px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:typing 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.ai-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:20px;background:linear-gradient(135deg,var(--accent2),var(--green2));color:var(--accent);font-weight:500}
@media(max-width:480px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>我的个人工作台 <span id="aiBadge" style="font-size:10px;color:var(--muted);background:#f0f2f5;padding:1px 5px;border-radius:4px;font-weight:400">本地 · 规则模式</span></h1>
    <div class="date" id="topDate"></div>
  </div>
  <span class="icon-btn" style="margin-left:auto" onclick="clearData()">🗑 清空</span>
</div>

<!-- 首页 -->
<section class="page active" id="page-home">
  <div class="card">
    <div class="row between"><h2 id="greet">你好</h2><span class="progress-num" id="homeProgressNum">0%</span></div>
    <div class="progress"><i id="homeProgress" style="width:0%"></i></div>
  </div>
  <div class="card">
    <h2>今日最重要的三件事 <span class="sub">先做完它们</span></h2>
    <div class="three" id="topThree"></div>
  </div>
  <div class="card">
    <h2>今日待办 <span class="sub" id="todoCount"></span></h2>
    <div id="homeTodos"></div>
    <details><summary>添加今日待办</summary>
      <div style="margin-top:8px"><input id="quickTodo" placeholder="写一件待办，回车添加"><div class="hint">添加后状态为「今天」，可在任务页调整。</div></div>
    </details>
  </div>
  <div class="card">
    <h2>每日习惯打卡 <span class="sub" id="habitProgressText"></span></h2>
    <div id="homeHabits"></div>
  </div>
  <div class="card">
    <h2>快速入口</h2>
    <div class="grid2">
      <button class="btn ghost block" onclick="goto('inbox')">🎙️ 说给小王听</button>
      <button class="btn ghost block" onclick="goto('chat')">💬 与小王对话</button>
    </div>
  </div>
  <div class="card">
    <h2>最近还没处理</h2>
    <div id="homePending"></div>
  </div>
</section>

<!-- 习惯 -->
<section class="page" id="page-habit"><div id="habitEditor"></div></section>

<!-- 任务 -->
<section class="page" id="page-task">
  <div class="card">
    <h2>添加任务</h2>
    <input id="taskName" placeholder="任务名称">
    <div class="grid2" style="margin-top:10px">
      <div><label class="fld">分类</label><select id="taskCat"><option>工作</option><option>学习</option><option>生活</option><option>商业</option><option>健康</option><option>其他</option></select></div>
      <div><label class="fld">优先级</label><select id="taskPri"><option>高</option><option selected>中</option><option>低</option></select></div>
    </div>
    <div class="grid2" style="margin-top:4px">
      <div><label class="fld">截止日期</label><input id="taskDue" type="date"></div>
      <div><label class="fld">状态</label><select id="taskStatus"><option>收件箱</option><option selected>待处理</option><option>今天</option><option>进行中</option><option>等待中</option><option>暂时搁置</option></select></div>
    </div>
    <label class="fld">备注</label><input id="taskNote" placeholder="可选">
    <button class="btn block" style="margin-top:12px" onclick="addTask()">添加任务</button>
  </div>
  <div class="card">
    <h2>任务看板 <span class="sub" id="taskTotal"></span></h2>
    <div id="taskBoard"></div>
  </div>
</section>

<!-- 收件箱 -->
<section class="page" id="page-inbox">
  <div class="card">
    <h2>🎙️ 随时说给小王听</h2>
    <textarea id="voiceInput" placeholder="把此刻脑子里的话一股脑说出来：想法、要买的东西、担心的事、想研究的主题……小王会帮你整理。"></textarea>
    <button class="btn block" style="margin-top:10px" onclick="submitVoice()">交给小王整理</button>
  </div>
  <div class="card">
    <h2>灵感收件箱 <span class="sub" id="inboxCount"></span></h2>
    <div class="seg" id="inboxFilter" style="margin-bottom:8px">
      <button class="on" data-f="all">全部</button><button data-f="待整理">待整理</button><button data-f="已归档">已归档</button><button data-f="已转任务">已转任务</button>
    </div>
    <div id="inboxList"></div>
  </div>
</section>

<!-- 小王对话 -->
<section class="page" id="page-chat">
  <div class="card">
    <h2>💬 与小王对话 <span class="ai-badge" id="chatAiBadge">AI</span></h2>
    <div class="chatbox" id="chatbox"></div>
    <div class="quick" id="quickCmds"></div>
    <div class="row" style="margin-top:6px">
      <input id="chatInput" placeholder="试试：安排一下今天 / 记一下… / 帮我复盘今天">
      <button class="btn mini" style="flex:0 0 auto" onclick="sendChat()">发送</button>
    </div>
  </div>
</section>

<!-- 复盘 -->
<section class="page" id="page-review">
  <div class="card">
    <div class="card-header row between">
      <h2>每日复盘 <span class="sub" id="reviewDate"></span></h2>
      <button class="btn mini ghost" onclick="genAIReview()">🤖 AI 生成</button>
    </div>
    <div id="dailyReview"></div>
    <button class="btn soft block" style="margin-top:10px" onclick="saveDailyReview()">保存今日复盘</button>
  </div>
  <div class="card">
    <h2>每周复盘 <span class="sub" id="weeklyDate"></span></h2>
    <div id="weeklyReview"></div>
  </div>
</section>

<div class="tabbar" id="tabbar">
  <button class="active" data-p="home"><span class="ic">🏠</span>首页</button>
  <button data-p="habit"><span class="ic">🌱</span>习惯</button>
  <button data-p="task"><span class="ic">📋</span>任务</button>
  <button data-p="inbox"><span class="ic">📥</span>收件箱</button>
  <button data-p="chat"><span class="ic">🤖</span>小王</button>
  <button data-p="review"><span class="ic">📊</span>复盘</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// 我的个人工作台 - 纯前端版 (localStorage + AI)
// ============================================================

// --- 配置 ---
const AI_API_KEY = 'sk-9VLIov4WKGcVhlqjbJoirkexWMSCCr4B15HVND9JHZjcVZBa';
const AI_API_URL = 'https://cmkey.cn/v1/messages';
const AI_MODEL = 'glm-5.2';

// --- 状态 ---
let state = loadState();
let curPage = 'home';

const HABIT_CATS = [
  {key:'learning',name:'学习',fields:[{k:'content',label:'今日学习内容'},{k:'duration',label:'学习时长'},{k:'courseDone',label:'是否完成课程/视频',type:'bool'},{k:'keyLearning',label:'今日关键收获'}]},
  {key:'reading',name:'阅读',fields:[{k:'book',label:'书名'},{k:'pages',label:'页数/时长'},{k:'progress',label:'阅读进度'},{k:'excerpt',label:'摘录/感想'}]},
  {key:'exercise',name:'运动与健身',fields:[{k:'type',label:'运动类型'},{k:'duration',label:'运动时长'},{k:'part',label:'训练部位'},{k:'weight',label:'今日体重(选填)'},{k:'feeling',label:'身体状态/感受'}]},
  {key:'work',name:'工作',fields:[{k:'top',label:'今日最重要的工作'},{k:'normal',label:'普通工作任务'},{k:'done',label:'已完成事项'},{k:'problem',label:'遇到的问题'},{k:'next',label:'明日继续的工作'}]},
  {key:'life',name:'生活',fields:[{k:'temp',label:'临时待办'},{k:'appt',label:'预约/购物/缴费/重要日期'},{k:'later',label:'可延后处理'}]}
];
const TASK_STATUS = ['收件箱','待处理','今天','进行中','等待中','已完成','暂时搁置'];
const QUICK_CMDS = ['安排一下今天','记一下…','我刚想到…','我今天做了…','帮我复盘今天','整理一下最近的想法'];

// --- 工具函数 ---
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function $(id){return document.getElementById(id)}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}

// --- 数据持久化 ---
function defaults(){return{topThree:{},tasks:[],habits:{},inbox:[],chat:[],reviews:{daily:{},weekly:{}}}}
function loadState(){try{const s=localStorage.getItem('workbench_state');return s?JSON.parse(s):defaults()}catch(e){return defaults()}}
function save(){localStorage.setItem('workbench_state',JSON.stringify(state));renderTop()}

function clearData(){if(confirm('确定要清空所有数据吗？')){localStorage.removeItem('workbench_state');state=defaults();render(curPage);toast('已清空')}}

// --- AI 调用 ---
async function callAI(messages, system, opts){
  if(!AI_API_KEY||!AI_API_KEY.startsWith('sk-')){throw new Error('未配置 API Key')}
  const body={model:AI_MODEL,max_tokens:opts?.maxTokens||1024,temperature:opts?.temperature??0.7,system:system||'你是小王，一个温暖的个人成长助理。用中文回复，简洁自然。',messages};
  try{
    const r=await fetch(AI_API_URL,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':AI_API_KEY,'anthropic-version':'2023-06-01'},body:JSON.stringify(body)});
    if(!r.ok){const t=await r.text().catch(()=>'');throw new Error(`API ${r.status}: ${t}`)}
    const d=await r.json();return d.content?.[0]?.text||''
  }catch(e){console.error('[AI]',e);throw e}
}

async function aiChat(msg, history){
  const ctx=[];
  if(state.tasks.length){ctx.push({role:'user',content:'[今日任务：'+state.tasks.filter(t=>t.status==='今天'||t.due_date===todayStr()).slice(0,8).map(t=>t.name+'('+t.priority+')').join('、')+']'});ctx.push({role:'assistant',content:'好的'})}
  const msgs=[...ctx,...history.slice(-16),{role:'user',content:msg}];
  const sys='你是「小王」，一个温暖、专业、有洞察力的个人成长助理。\n\n用中文自然对话，每条不超过200字。\n\n根据用户输入，你可以：\n1. 日常对话\n2. 智能分类（商业灵感、学习心得、担忧/问题、想购买、研究主题、任务、想法、随想）\n3. 提取待办\n4. 安排日程\n5. 复盘总结\n\n信息不足时主动追问，不要猜。不要用markdown标题。';
  return await callAI(msgs,sys)
}

async function aiProcessText(text){
  const sys='分析用户输入的文本，只返回JSON格式（不要其他文字）。格式：{"type":"分类","tags":["标签"],"summary":"摘要","todo":{"content":"待办内容","priority":"高/中/低","dueDate":"YYYY-MM-DD或空"}}。如果没有待办，todo为null。';
  const r=await callAI([{role:'user',content:'分析："""'+text+'"""'}],sys,{temperature:0.3,maxTokens:500});
  try{const j=JSON.parse(r);return j}catch(e){return fallbackProcess(text)}
}

async function aiReview(tasks,habits,date){
  const t=tasks.map(t=>`- ${t.name}(${t.priority},${t.status})`).join('\n');
  const h=habits.map(h=>`- ${h.category}:${h.done?'✅':'❌'}`).join('\n');
  const sys='你是有洞察力的复盘助手。根据数据生成温暖、有建设性的复盘总结。中文，不超过300字，纯文本。';
  const r=await callAI([{role:'user',content:`${date}\n任务：\n${t}\n习惯：\n${h}\n写复盘：总结、亮点、改进点、明天建议`}],sys,{temperature:0.7,maxTokens:600});
  return r
}

async function aiArrange(tasks){
  const t=tasks.map(t=>`- ${t.name}(${t.priority},截止:${t.due_date||'无'})`).join('\n');
  const sys='你是效率助手。安排最重要的3件事并说明理由。中文，不超过200字。';
  const r=await callAI([{role:'user',content:`任务：\n${t}\n安排今天最重要的3件事`}],sys,{temperature:0.7,maxTokens:500});
  return r
}

// --- 规则回退 ---
function fallbackProcess(text){
  const tr=[{t:'商业灵感',k:['商业','创业','赚钱','产品','用户','市场','生意','营收','变现','商业模式']},{t:'担忧/问题',k:['担心','担忧','怕','焦虑','问题','风险','不确定','麻烦','卡住']},{t:'学习心得',k:['学','课程','知识点','懂了','明白了','读书笔记','笔记','理解']},{t:'想购买',k:['买','购','下单','淘宝','京东','购物车','囤']},{t:'研究主题',k:['研究','查一下','了解','深入','课题','调研','看看怎么']},{t:'任务',k:['要','需要','记得','别忘了','计划','打算','应该','必须','安排','完成','做']},{t:'想法',k:['想法','灵感','点子','创意','主意']}];
  const tw=['学习','工作','生活','健康','商业','投资','读书','运动','家庭','效率','副业','写作'];
  let type='随想';for(const r of tr){if(r.k.some(k=>text.includes(k))){type=r.t;break}}
  const tags=tw.filter(w=>text.includes(w));
  const hasTodo=['要','需要','记得','别忘了','计划','打算','应该','必须','安排','完成','去做','预约','缴费','购物','买'].some(k=>text.includes(k));
  const first=text.split(/[。！？\n]/)[0].trim();const summary=first.length<=40?(first||text.slice(0,40)):first.slice(0,40)+'…';
  let todo=null;
  if(hasTodo){
    const pri=/紧急|马上|立刻|尽快|重要|务必/.test(text)?'高':(/有空|以后|改天|可能|随便|也许/.test(text)?'低':'中');
    let dd='';if(/今天/.test(text))dd=todayStr();const tm=new Date();tm.setDate(tm.getDate()+1);if(/明天/.test(text))dd=todayStr(tm);
    todo={content:summary,priority:pri,dueDate:dd}
  }
  return {type,tags,summary,todo,hasTodo}
}

  document.querySelectorAll('section.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+p));

}

// --- 习惯 ---
function getHabit(date){if(!state.habits[date])state.habits[date]={};return state.habits[date]}
function habitDone(date){const h=getHabit(date);return HABIT_CATS.filter(c=>h[c.key]&&h[c.key]._done).length}
function toggleHabit(key){const h=getHabit(todayStr());if(!h[key])h[key]={};h[key]._done=!h[key]._done;save();renderHome()}

function renderHabit(){
  const date=todayStr(),h=getHabit(date);
  let html='<div class="card"><h2>今日习惯 · '+date+'</h2><div class="hint">今天完成 <b>'+habitDone(date)+'/'+HABIT_CATS.length+'</b> 项。</div></div>';
  HABIT_CATS.forEach(c=>{
    const d=h[c.key]||{},on=d._done;
    const fields=c.fields.map(f=>{
      const v=d[f.k]||'';
      if(f.type==='bool')return '<label class="fld">'+f.label+'</label><div class="seg" data-bool="'+c.key+'.'+f.k+'"><button class="'+(v==='是'?'on':'')+'" data-v="是">是</button><button class="'+(v==='否'?'on':'')+'" data-v="否">否</button></div>';
      return '<label class="fld">'+f.label+'</label><input data-f="'+c.key+'.'+f.k+'" value="'+esc(v)+'">'
    }).join('');
    html+='<div class="card"><div class="row between" style="margin-bottom:6px"><h2 style="margin:0">'+c.name+'</h2><div class="chk '+(on?'on':'')+'" onclick="toggleHabit(\''+c.key+'\');renderHabit()" style="cursor:pointer">'+(on?'✓':'')+'</div></div>'+fields+'</div>'
  });

  $('habitEditor').querySelectorAll('[data-f]').forEach(el=>{el.onchange=()=>{const[k,f]=el.dataset.f.split('.');getHabit(todayStr())[k]=getHabit(todayStr())[k]||{};getHabit(todayStr())[k][f]=el.value;save()}});
  $('habitEditor').querySelectorAll('[data-bool]').forEach(el=>{el.querySelectorAll('button').forEach(b=>{b.onclick=()=>{const[k,f]=el.dataset.bool.split('.');getHabit(todayStr())[k]=getHabit(todayStr())[k]||{};getHabit(todayStr())[k][f]=b.dataset.v;el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));save()}})})

function processAndSave(raw){
  raw=raw.trim();if(!raw)return null;

  const item={id:uid(),raw,summary:result.summary,type:result.type,tags:result.tags,has_todo:!!result.todo,status:result.todo?'已转任务':'已归档',todo_content:result.todo?.content||'',todo_priority:result.todo?.priority||'中',todo_due_date:result.todo?.dueDate||null,created_at:new Date().toISOString()};
  state.inbox.unshift(item);
  if(result.todo){state.tasks.push({id:uid(),name:result.todo.content,category:result.type==='商业灵感'?'商业':result.type==='学习心得'?'学习':result.type==='想购买'?'生活':'其他',created_date:todayStr(),due_date:result.todo.dueDate||null,priority:result.todo.priority||'中',status:'待处理',notes:raw})}
  save();toast(result.todo?'已整理并转为任务 ✓':'已收进灵感收件箱 ✓');return item
}

async function sendChat(){
  const v=$('chatInput').value.trim();if(!v)return;
  pushMsg('me',v);$('chatInput').value='';
  const box=$('chatbox');
  box.innerHTML+='<div class="msg xw" id="typing"><div class="av">王</div><div class="typing"><span></span><span></span><span></span></div></div>';
  box.scrollTop=box.scrollHeight;

function xiaowangFallback(text){
  const t=text.trim();
  if(/安排.*今天|今天.*安排/.test(t))return cmdArrange();
  if(/^记一下|^帮我记|记录一下/.test(t))return cmdNote(t);
  if(/我刚想到|突然想到|刚想到/.test(t))return cmdIdea(t);
  if(/我今天做了|我做了|已经(完成|做完)|搞定了/.test(t))return cmdDone(t);
  if(/复盘|总结今天|今日总结/.test(t))return cmdReview();
  if(/整理.*想法|梳理.*想法/.test(t))return cmdOrganize();
  const r=fallbackProcess(t);
  if(r.todo)return '收到，已提取待办：'+r.todo.content+'（'+r.todo.priority+'优先级）';
  return '收到，已收进灵感收件箱（类型：'+r.type+'）。需要我帮你做什么吗？'
}
function cmdArrange(){
  const pool=state.tasks.filter(t=>(t.status==='今天'||t.due_date===todayStr()||t.status==='待处理')&&t.status!=='已完成');
  if(!pool.length)return '今天没什么任务。';
  pool.sort((a,b)=>({高:0,中:1,低:2})[a.priority]-(['高':0,'中':1,'低':2])[b.priority]);
  const top3=pool.slice(0,3);state.topThree[todayStr()]=top3.map(t=>t.name).concat(['','','']).slice(0,3);save();
  return '建议今天：\n'+top3.map((t,i)=>' '+(i+1)+'. '+t.name+'（'+t.priority+'）').join('\n')+'\n已写进今日三件事。'
}
function cmdNote(t){const raw=t.replace(/^记一下[:：]?|^帮我记[:：]?|记录一下[:：]?/,'').trim();if(!raw)return '记什么？';const r=fallbackProcess(raw);processAndSave(raw);return r.todo?'已记下并转为任务 ✓':'已记下，收进收件箱。'}
function cmdIdea(t){const raw=t.replace(/我刚想到[:：]?|突然想到[:：]?|刚想到[:：]?|想到一个[:：]?/,'').trim();if(!raw)return '想到什么了？';processAndSave(raw);return '记下了，先放着回头再看。'}
function cmdDone(t){let did=[];const map=[['学','learning'],['读','reading'],['运动','exercise'],['健身','exercise'],['工作','work'],['生活','life']];const h=getHabit(todayStr());map.forEach(([k,cat])=>{if(t.includes(k)){h[cat]=h[cat]||{};h[cat]._done=true;did.push(HABIT_CATS.find(c=>c.key===cat)?.name+'打卡')}});state.tasks.filter(x=>x.status!=='已完成'&&t.includes(x.name.slice(0,Math.max(2,x.name.length)))).forEach(x=>{x.status='已完成';did.push('完成任务：'+x.name)});save();return did.length?'已更新 ✅\n'+did.map(d=>'· '+d).join('\n'):'没对应上具体的任务或习惯。'}
function cmdReview(){const date=todayStr();const done=state.tasks.filter(t=>t.status==='已完成');const undone=state.tasks.filter(t=>t.status!=='已完成');const dh=HABIT_CATS.filter(c=>{const h=getHabit(date);return h[c.key]&&h[c.key]._done}).map(c=>c.name);return '【今日复盘】\n✅ 完成：'+(done.length?done.map(t=>t.name).join('、'):'无')+'\n🌱 习惯：'+(dh.length?dh.join('、'):'无')+'\n❌ 未完成：'+(undone.length?undone.map(t=>t.name).join('、'):'无')+'\n💡 明天优先做最重要的一件事。'}
function cmdOrganize(){const pend=state.inbox.filter(i=>i.status==='待整理'||i.status==='已归档');if(!pend.length)return '收件箱很干净。';return '有 '+pend.length+' 条待整理的想法，去收件箱看看吧。'}

// --- 复盘 ---
async function genAIReview(){
  const btn=document.querySelector('#page-review .btn.mini');btn.disabled=true;btn.textContent='🤖 生成中...';
  try{
    const date=todayStr();const tasks=state.tasks.filter(t=>t.created_date===date||t.due_date===date);const habits=HABIT_CATS.map(c=>{const h=getHabit(date)[c.key]||{};return{category:c.name,done:h._done}});
    const summary=await aiReview(tasks,habits,date);
    let el=document.querySelector('#dailyReview .ai-summary');if(!el){el=document.createElement('div');el.className='ai-summary';$('dailyReview').prepend(el)}
    el.innerHTML='<div class="card" style="background:var(--accent2);margin-bottom:10px"><div class="row"><span class="ai-badge">AI</span> <span class="text-sm">小王复盘</span></div><div class="text-sm" style="margin-top:6px;white-space:pre-wrap">'+esc(summary)+'</div></div>';
    toast('AI 复盘已生成 ✓')
  }catch(e){toast('AI 未连接，使用本地数据')}
  finally{btn.disabled=false;btn.textContent='🤖 AI 生成'}
}
function renderReview(){
  const date=todayStr();$('reviewDate').textContent=date;
  const now=new Date(),dow=(now.getDay()+6)%7,mon=new Date(now);mon.setDate(now.getDate()-dow);const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  $('weeklyDate').textContent=mon.toISOString().slice(0,10)+' ~ '+sun.toISOString().slice(0,10);
  const dr=state.reviews.daily[date]||{};
  $('dailyReview').innerHTML='<div class="ai-summary">'+(dr.ai_summary?'<div class="card" style="background:var(--accent2);margin-bottom:10px"><div class="row"><span class="ai-badge">AI</span> <span class="text-sm">小王复盘</span></div><div class="text-sm" style="margin-top:6px;white-space:pre-wrap">'+esc(dr.ai_summary)+'</div></div>':'')+'</div><label class="fld">今日完成事项</label><textarea id="rvDone" placeholder="今天做成了什么">'+esc((dr.done||[]).join('、'))+'</textarea><label class="fld">今日习惯完成情况</label><input id="rvHabit" value="'+esc((dr.habits||[]).join('、'))+'" placeholder="如：学习、运动"><label class="fld">今日最有价值的收获</label><textarea id="rvGain" placeholder="一个就够了">'+esc(dr.gain||'')+'</textarea><label class="fld">今日未完成事项</label><textarea id="rvUndo" placeholder="哪些没做">'+esc((dr.undone||[]).join('、'))+'</textarea><label class="fld">明日最重要的三件事</label><textarea id="rvNext" placeholder="明天先打这三只青蛙">'+esc(dr.next||'')+'</textarea>';
  renderWeekly()
}
function saveDailyReview(){const date=todayStr();state.reviews.daily[date]={done:$('rvDone').value.split(/[、,\n]/).map(s=>s.trim()).filter(Boolean),habits:$('rvHabit').value.split(/[、,\n]/).map(s=>s.trim()).filter(Boolean),gain:$('rvGain').value.trim(),undone:$('rvUndo').value.split(/[、,\n]/).map(s=>s.trim()).filter(Boolean),next:$('rvNext').value.split(/[、,\n]/).map(s=>s.trim()).filter(Boolean),at:Date.now()};save();toast('已保存 ✓')}
function renderWeekly(){
  const now=new Date(),dow=(now.getDay()+6)%7,mon=new Date(now);mon.setDate(now.getDate()-dow);const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const range=[todayStr(mon),todayStr(sun)],inRange=d=>d>=range[0]&&d<=range[1];
  const weekTasks=state.tasks.filter(t=>t.created_date>=range[0]&&t.status==='已完成'),totalWeek=state.tasks.filter(t=>t.created_date>=range[0]);
  const rate=totalWeek.length?Math.round(weekTasks.length/totalWeek.length*100):0;
  const h=state.habits;const ld=Object.keys(h).filter(d=>inRange(d)&&h[d].learning&&h[d].learning._done).length;
  const rd=Object.keys(h).filter(d=>inRange(d)&&h[d].reading&&h[d].reading._done).length;
  const ed=Object.keys(h).filter(d=>inRange(d)&&h[d].exercise&&h[d].exercise._done).length;
  const ni=state.inbox.filter(i=>{const d=i.created_at?i.created_at.slice(0,10):'';return inRange(d)}).length;
  const ac=state.inbox.filter(i=>i.status==='已转任务').length;
  $('weeklyReview').innerHTML='<div class="grid3" style="margin-bottom:12px"><div class="stat-card"><div class="num">'+rate+'%</div><div class="label">任务完成率</div></div><div class="stat-card"><div class="num">'+(ld+rd+ed)+'</div><div class="label">习惯天数</div></div><div class="stat-card"><div class="num">'+ni+'</div><div class="label">新想法</div></div></div><div class="item" style="border:none"><span class="pill g">完成</span><div class="body">'+weekTasks.length+'/'+totalWeek.length+' 个任务</div></div><div class="item" style="border:none"><span class="pill">学习/阅读/运动</span><div class="body">学习 '+ld+' 天 · 阅读 '+rd+' 天 · 运动 '+ed+' 天</div></div><div class="item" style="border:none"><span class="pill">新想法</span><div class="body">本周记录 '+ni+' 条，'+ac+' 条转为任务</div></div><label class="fld">下周最重要的目标</label><textarea id="wkGoal" placeholder="下周最想拿下的 1-3 件事">'+esc((state.reviews.weekly&&state.reviews.weekly[range[0]]&&state.reviews.weekly[range[0]].goal)||'')+'</textarea><button class="btn block" style="margin-top:8px" onclick="saveWeekly(\''+range[0]+'\')">保存本周目标</button>'
}
function saveWeekly(m){state.reviews.weekly=state.reviews.weekly||{};state.reviews.weekly[m]={goal:$('wkGoal').value.trim(),at:Date.now()};save();toast('已保存 ✓')}

// --- 键盘事件 ---
document.addEventListener('keydown',e=>{
  if(e.target.id==='quickTodo'&&e.key==='Enter'){const v=e.target.value.trim();if(v){state.tasks.push({id:uid(),name:v,category:'其他',created_date:todayStr(),due_date:null,priority:'中',status:'今天',notes:''});save();e.target.value='';renderHome()}}
  if(e.target.id==='chatInput'&&e.key==='Enter')sendChat()
});

// --- 启动 ---
renderTop();render('home');
</script>
</body>
</html>
